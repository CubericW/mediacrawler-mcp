[project]
name = "mediacrawler-mcp"
version = "0.1.0"
description = "MCP server wrapping MediaCrawler for agent-driven collection of public data from Chinese social platforms (personal/research use only)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "mcp>=1.2.0,<2",
    "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[project.scripts]
mediacrawler-mcp = "mediacrawler_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mediacrawler_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
